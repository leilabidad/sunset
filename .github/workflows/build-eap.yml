name: ACAP Project – Test & Upload

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/**'

jobs:
  test-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List workspace files
        run: ls -R ${{ github.workspace }}

      - name: Syntax check C files (gcc)
        run: |
          for f in app/src/*.c; do
            echo "Checking $f"
            gcc -fsyntax-only "$f"
          done

      - name: Upload prebuilt .eap artifact
        uses: actions/upload-artifact@v4
        with:
          name: acap-package
          path: app/bin/*.eap
