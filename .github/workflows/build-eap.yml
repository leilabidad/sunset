name: Build ACAP .eap (Debug, emulated ARM64)

on:
  push:
    paths:
      - 'app/**'
      - 'build-inside-sdk.sh'
      - '.github/workflows/build-eap.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Pull ACAP SDK image (arm64)
        run: docker pull axisecp/acap-native-sdk:12.4.0-aarch64-ubuntu24.04

      - name: List workspace files
        run: ls -R ${{ github.workspace }}

      - name: Run ACAP SDK container (Debug)
        run: |
          timeout 600 docker run --platform linux/arm64 --rm \
            -v ${{ github.workspace }}:/opt/workspace \
            axisecp/acap-native-sdk:12.4.0-aarch64-ubuntu24.04 \
            /bin/bash -c "set -x; ls /opt/workspace; /opt/workspace/build-inside-sdk.sh"

      - name: Check built .eap files
        run: ls -l app/bin/

      - name: Upload built .eap artifact
        uses: actions/upload-artifact@v4
        with:
          name: acap-package
          path: app/bin/*.eap
